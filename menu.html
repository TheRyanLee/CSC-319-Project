<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Menu</h1>
        <p class="tagline">Come hungry. Leave legendary.</p>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="review.html">Review</a></li>
                <li><a href="employee.html">Employee Page</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        

        <h2 class="menu-header">Guest Favorites</h2>
        <section class = "favorites">
            <section class = "card favorite-menu-item">
                <img src="images/PrimeRibBuffet.png" alt="Prime Rib" class="responsive-img">
                <h3>Prime Rib</h3>
            </section>

            <section class = "card favorite-menu-item">
                <img src="images/steak.png" alt="Steak" class="responsive-img">
                <h3>Steak</h3>
            </section>

            <section class = "card favorite-menu-item">
                <img src="images/lobster.png" alt="Lobster" class="responsive-img">
                <h3>Lobster</h3>
            </section>
        </section>

        <h2 class="menu-header">Our Menu</h2>
        <section class = "foodMenu">
            <section class="card menu-item">
                <h2>Breakfast</h2>
                <ul id="breakfastMenu"></ul>
            </section>

            <section class="card menu-item">
                <h2>Lunch</h2>
                <ul id="lunchMenu"></ul>
            </section>

            <section class="card menu-item">
                <h2>Dinner</h2>
                <ul id="dinnerMenu"></ul>
            </section>
        </section>

        <h2 class="menu-header">New Menu Requests</h2>
        <section class = "card menu-request">
            <form id="menuRequestForm">
                <div class="form-group">
                    <label for="request">Request a new menu item:</label>
                    <input type="text" id="request" name="request" required>
                </div>
                <div class="button-row">
                    <button type="submit">Submit</button>
                    <button type="button" id="clearAllBtn">Clear All Requests</button>
                </div>
            </form>

            <p id="requestFeedback" class="mt-2" role="status" aria-live="polite"></p>
            <h3 class="mt-3">Submitted Requests (<span id="requestCount">0</span>)</h3>
            <ul id="requestList"></ul>
        </section>
    </main>
</body>
</html>
