<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Review Us!</h1>
        <p class="tagline">Come hungry. Leave legendary.</p>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="review.html">Review</a></li>
                <li><a href="employee.html">Employee Page</a></li>
            </ul>
        </nav>

    </header>

    <main class="container">
        <h2 class="instruction-header">Form Details and Instructions</h2>
        <section class="card" id="form-instructions">
            <p>Filling this review out helps us rotate our menu based on the highest rated foods. Reviewing earns you points on the leaderboard.</p>
        </section>

        <form id="review-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input id="full-name"
                        name="fullName"
                        type="text"
                        minlength="2"
                        maxlength="50"
                        required>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email"
                        name="email"
                        type="email"
                        required
                        placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone"
                        name="phone"
                        minlength="10"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        placeholder="Enter 10 digits.(example 0-9)"
                        required>
                </div>
            </div>
            <div class="form-row">

                <div class="form-group">
                    <label for="breakfast">Favorite Breakfast Item</label>
                    <select id="breakfast" name="breakfast">
                        <option value="">Choose your favorite breakfast item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="lunch">Favorite Lunch Item</label>
                    <select id="lunch" name="lunch">
                        <option value="">Choose your favorite lunch item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dinner">Favorite Dinner Item</label>
                    <select id="dinner" name="dinner">
                        <option value="">Choose your favorite dinner item</option>
                    </select>
                </div>
                
            </div>
            <fieldset>
                <legend>How often do you currently eat here?</legend>
                <label>
                    <input type="radio" name="frequent" value="daily" required>
                    Daily
                </label>
                <label>
                    <input type="radio" name="frequent" value="weekly">
                    Weekly
                </label>
                <label>
                    <input type="radio" name="frequent" value="monthly">
                    Monthly
                </label>
                <label>
                    <input type="radio" name="frequent" value="allMeals">
                    Literally Every Meal
                </label>                       
            </fieldset>
            <div class="button-row">
                <button type="submit">Submit</button>
                <button type="reset">Clear form</button>
            </div>



        </form>


    </main>

</body>
</html>
